name: Feature request
description: Suggest a legitimate PvP optimization feature
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What PvP pain point should be solved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the legal/QoL optimization behavior.
    validations:
      required: true
  - type: textarea
    id: fairness
    attributes:
      label: Fairness check
      description: Explain why this remains optimization/QoL and not automation.
