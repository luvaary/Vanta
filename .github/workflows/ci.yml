name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Validate build
        run: ./gradlew build

      - name: Upload build jars
        uses: actions/upload-artifact@v4
        with:
          name: vanta-jars-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Print versioning info
        run: ./gradlew printVersioningInfo
