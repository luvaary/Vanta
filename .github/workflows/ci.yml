name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Validate build
        run: ./gradlew build

      - name: Upload build jars
        uses: actions/upload-artifact@v4
        with:
          name: vanta-jars-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Print versioning info
        run: ./gradlew printVersioningInfo

  auto-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Recognize version for automatic release
        id: version
        shell: bash
        run: |
          set -euo pipefail

          mod_version="$(grep -E '^mod_version=' gradle.properties | cut -d '=' -f2)"
          minecraft_version="$(grep -E '^minecraft_version=' gradle.properties | cut -d '=' -f2)"

          if [[ ! "$mod_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid mod_version in gradle.properties: $mod_version"
            exit 1
          fi

          if [[ ! "$minecraft_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid minecraft_version in gradle.properties: $minecraft_version"
            exit 1
          fi

          tag="ci-v${mod_version}-mc${minecraft_version}-build.${GITHUB_RUN_NUMBER}"

          echo "mod_version=$mod_version" >> "$GITHUB_OUTPUT"
          echo "minecraft_version=$minecraft_version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Download built jars from build job
        uses: actions/download-artifact@v4
        with:
          name: vanta-jars-${{ github.sha }}
          path: release-artifacts

      - name: Verify release jar naming
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          jars=(release-artifacts/*-mc${{ steps.version.outputs.minecraft_version }}-${{ steps.version.outputs.mod_version }}*.jar)
          if [ ${#jars[@]} -eq 0 ]; then
            echo "No version-matching JAR found for mod=${{ steps.version.outputs.mod_version }} mc=${{ steps.version.outputs.minecraft_version }}"
            ls -la release-artifacts || true
            exit 1
          fi
          printf 'Matched jars:\n%s\n' "${jars[*]}"

      - name: Create automatic GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Vanta CI v${{ steps.version.outputs.mod_version }} (MC ${{ steps.version.outputs.minecraft_version }}) build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-artifacts/*-mc${{ steps.version.outputs.minecraft_version }}-${{ steps.version.outputs.mod_version }}*.jar
